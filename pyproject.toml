[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweetrpg-client"
dynamic = ["version"]
description = "API client library for SweetRPG services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Paul Schifferer", email = "dm@sweetrpg.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "marshmallow==3.26.1",
    "sweetrpg-model-core",
    "sweetrpg-api-core",
    "sweetrpg-catalog-objects",
    "requests~=2.0",
    "jsonapi-client",
    "opentelemetry-api",
]

[project.urls]
Documentation = "https://sweetrpg.github.io/client"

[project.scripts]
sweetrpg-client = "sweetrpg_client.cli:main"

[dependency-groups]
test = [
    "asgiref",
    "blinker",
    "coverage-badge~=1.0",
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "pytest-env",
    "pytest-ordering",
    "python-dotenv~=1.2",
    "responses",
]
docs = [
    "Pallets-Sphinx-Themes",
    "Sphinx~=8.0",
    "sphinx-issues",
    "sphinxcontrib-log-cabinet",
    "sphinx-tabs",
    "rstcheck",
]

[tool.hatch.version]
path = "src/sweetrpg_client/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sweetrpg_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # sweetrpg-catalog-objects==0.0.175's schema classes use marshmallow's deprecated
    # `default=` kwarg (should be `dump_default`). Can't fix at the source - that repo's
    # develop branch has no code for this module (src/sweetrpg_catalog_objects/__init__.py
    # only), so whatever produced the published wheel isn't reachable to patch right now.
    # Still functional under the pinned marshmallow==3.26.1, just deprecated.
    "ignore::marshmallow.warnings.RemovedInMarshmallow4Warning",
]

[tool.coverage.run]
branch = true
source = [
    "sweetrpg_client",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]
