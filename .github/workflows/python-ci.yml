name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - pyproject.toml
            - uv.lock
            - "docs/**"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Lockfile"]
        types: [completed]
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.14",
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
            - name: sync-deps
              run: uv sync --group test --frozen
            - name: tests
              run: uv run coverage run -m pytest -v tests
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  mkdir -p coverage-pages
                  uv run coverage xml -o coverage-pages/coverage.xml
                  uv run coverage html -d coverage-pages/htmlcov
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: coverage-pages/
            # Warn-only: continue-on-error means this never blocks a merge, only shows
            # as a flagged step. Reuses the .coverage data the tests step already wrote.
            - name: coverage-threshold
              continue-on-error: true
              run: uv run coverage report --fail-under=0
            # Written into a dir published below rather than committed to develop - a
            # direct push there is rejected outright by this repo's PR-only ruleset.
            # destination_dir: coverage, since the docs job below publishes to the
            # gh-pages root with keep_files: true - colliding at the root would wipe
            # one or the other on every run.
            - name: coverage-badge
              continue-on-error: true
              run: |
                  PCT=$(uv run coverage report | grep '^TOTAL' | grep -oE '[0-9]+%' | tr -d '%')
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage-pages/coverage-badge.json
            - name: publish-coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage-pages
                  destination_dir: coverage

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.14"
            - name: make-docs
              run: cd docs && uv run --group docs make html
            # keep_files: true - without it, this root-level publish (no destination_dir)
            # wipes the whole branch by default, deleting the tests job's coverage/
            # subfolder that ran moments earlier in the same workflow.
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
                  keep_files: true
