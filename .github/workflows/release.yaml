name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: sweetrpg/github-actions/.github/workflows/python-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # This repo manages dependencies with uv (pyproject.toml + uv.lock) - the reusable
      # workflow's pip-requirements defaults don't apply (there is no requirements/tests.txt).
      install-command: uv sync --group test
      test-command: uv run pytest tests
      publish-to-pypi: true
      # PyPI rejected a token-authenticated publish here: "Uploading new files to releases
      # older than 14 days is not allowed" (dormant since 2022). Requires a Trusted Publisher
      # configured on the sweetrpg-client PyPI project: owner/repo=sweetrpg/client.py,
      # workflow filename=release.yaml.
      pypi-trusted-publishing: true
    secrets: inherit
